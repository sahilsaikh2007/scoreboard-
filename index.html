<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    
    
    <title>score-counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
    
    
    <div class="score-counter">

  <div class="home">
    <h1 >HOME</h1>
    <h1 class="score" id="h">0</h1>
    <div class="btn"><button class="btn-style" onclick="addPoints('H',1)">+1</button>
     <button class="btn-style" onclick="addPoints('H',2)" >+2</button>
    <button class="btn-style"  onclick="addPoints('H',3)">+3</button></div> 
  </div>
<div class="guest">
<h1>AWAY</h1>
<h1 class="score" id="g">0</h1>
<button class="btn-style"  onclick="addPoints('G',1)" >+1</button>
<button class="btn-style"  onclick="addPoints('G',2)">+2</button>
<button class="btn-style"  onclick="addPoints('G',3)">+3</button>

    </div>

    </div>
    
<div class="reset-btn-container"><button id="reset-btn" onclick="reset()"> RESET</button>
    
</div>

</div>


    <script src="index.js"></script>
</body>
</html>
